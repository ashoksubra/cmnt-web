<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMNT Web — Composer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Serif+Tamil:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-row">
        <h1>CMNT Web <span class="app-header-sub">Composer</span></h1>
        <span id="doc-title" class="doc-title" title="Current song file">Untitled.txt</span>
        <div class="app-header-note">Path A &mdash; SVG score with live Indic transliteration</div>
      </div>
      <nav id="menubar" class="menubar" aria-label="Application"></nav>
    </header>

    <main class="composer">
      <section class="editor-pane">
        <div class="toolbar">
          <label class="field">
            <span>Sample</span>
            <select id="fixture-select">
              <option value="smoke_adi">smoke_adi</option>
              <option value="smoke_adi_tamil">smoke_adi_tamil</option>
              <option value="smoke_rupaka">smoke_rupaka</option>
              <option value="maha_ganapatim">maha_ganapatim</option>
              <option value="sankachakra">sankachakra</option>
            </select>
          </label>

          <label class="field">
            <span>Language</span>
            <select id="lang-select">
              <option value="auto">Auto (from source)</option>
              <option value="english">English</option>
              <option value="tamil">Tamil</option>
              <option value="telugu">Telugu</option>
              <option value="kannada">Kannada</option>
              <option value="sanskrit">Sanskrit</option>
            </select>
          </label>

          <label class="field">
            <span title="School presets are the primary theming control -- see src/theme/schools.ts">School</span>
            <select id="school-select"></select>
          </label>

          <label class="field field-checkbox">
            <input type="checkbox" id="live-update-toggle" checked />
            <span>Live update</span>
          </label>

          <button id="render-btn" type="button" class="primary-btn">Update</button>
        </div>

        <div class="playback-bar" title="Playback instrument and speed (applied on Play)">
          <label class="field" title="Beats per minute (1 akshara = 1 beat). Notation DefaultSpeed 0/1/2 is separate — Insert → Default Speed…">
            <span>BPM</span>
            <input
              id="bpm-input"
              type="number"
              min="20"
              max="240"
              step="1"
              value="60"
              aria-label="Tempo in BPM"
            />
          </label>
          <label class="field field-checkbox" title="Audible metronome click on each akshara beat">
            <input type="checkbox" id="click-toggle" />
            <span>Click</span>
          </label>
          <label class="field">
            <span>Instrument</span>
            <select id="instrument-select"></select>
          </label>
          <label class="field field-speed" title="Practice multiplier on top of BPM (1× = as written)">
            <span>Practice <em id="speed-label">1.0×</em></span>
            <input
              id="speed-slider"
              type="range"
              min="0.4"
              max="2.5"
              step="0.05"
              value="1"
              aria-label="Practice speed multiplier"
            />
          </label>
          <button id="play-btn" type="button" class="secondary-btn" title="Play from start (⌘/Ctrl+P)">▶ Play</button>
          <button id="stop-btn" type="button" class="secondary-btn" title="Stop (⌘/Ctrl+.)">■ Stop</button>
        </div>

        <div class="header-overrides" title="Catalogue names stay roman on Indic scores. Optional CMNT-roman ragam spelling (with @/#/~n) is saved as RaagamDisplay: and transliterated. Talam uses the fixed catalogue — no custom save.">
          <label class="field field-grow">
            <span>Raagam display (roman)</span>
            <input
              id="ragam-display"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="optional CMNT spelling e.g. pUrNa@ncandrikA"
            />
          </label>
          <div class="field field-grow talam-readonly">
            <span>Talam (catalogue)</span>
            <div id="talam-display" class="talam-display-ro" aria-live="polite">—</div>
          </div>
          <button id="save-headers-btn" type="button" class="secondary-btn" title="Write RaagamDisplay: into the source (persists on File → Save)">
            Save ragam
          </button>
          <button id="reset-headers-btn" type="button" class="secondary-btn" title="Clear RaagamDisplay: from source">
            Clear ragam
          </button>
        </div>

        <div id="syntax-help" class="syntax-help" hidden>
          <div class="syntax-help-header">
            <strong id="syntax-help-title">YAML front matter</strong>
            <button type="button" id="syntax-help-dismiss" class="syntax-help-dismiss" title="Hide for this session">Hide</button>
          </div>
          <pre id="syntax-help-body" class="syntax-help-body"></pre>
        </div>

        <div class="editor-scroll">
          <textarea
            id="source-input"
            class="source-input"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            wrap="off"
          ></textarea>
        </div>

        <div id="status-line" class="status status-ok">Ready</div>
      </section>

      <div
        id="pane-splitter"
        class="pane-splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize editor and preview"
        tabindex="0"
      ></div>

      <section class="preview-pane">
        <div class="preview-scroll">
          <div id="score-page" class="score-page"></div>
        </div>
      </section>
    </main>

    <input id="open-file-input" type="file" accept=".txt,.cmnt,text/plain" hidden />

    <script type="module" src="./main.ts"></script>
  </body>
</html>
